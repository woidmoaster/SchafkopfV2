<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTTO Schafkopf Stammtisch</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-black text-white font-sans p-4 md:p-8 min-h-screen">
  <div class="max-w-6xl mx-auto space-y-6">

    <!-- Header -->
    <header class="flex flex-col md:flex-row items-center justify-between border-b border-neutral-800 pb-4">
      <div class="flex items-center space-x-3">
        <div class="border border-neutral-700 rounded px-2 py-1 bg-neutral-900 text-xl font-mono">🂡</div>
        <div>
          <h1 class="text-3xl font-black tracking-wider">OTTO</h1>
          <p class="text-neutral-400 text-xs tracking-wide">Schafkopf Stammtisch</p>
        </div>
      </div>

      <!-- Jahr Filter (oben rechts) -->
      <div class="flex items-center space-x-3 mt-2 md:mt-0">
        <label for="yearFilter" class="text-neutral-400 text-xs">Jahr</label>
        <select id="yearFilter" class="bg-neutral-900 border border-neutral-800 text-xs rounded px-2 py-1 text-neutral-200">
          <!-- Optionen werden dynamisch befüllt -->
        </select>
        <div class="text-right text-xs text-neutral-400 font-light">
          Jeden dritten Donnerstag,<br>oder wann wir halt Zeit haben :)
        </div>
      </div>
    </header>

    <!-- Top Grid: Chart & Ranglisten -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Spieltage Chart -->
      <div class="bg-neutral-950 p-4 rounded-lg border border-neutral-800">
        <h2 class="text-center font-bold tracking-wide text-xs uppercase text-neutral-200 mb-3">
          SPIELTAGE <span class="text-neutral-500 font-normal">*ohne Ramsch</span>
        </h2>
        <div class="h-64 relative">
          <canvas id="spieltageChart"></canvas>
        </div>
      </div>

      <!-- Rechts: König & Jahreswertung -->
      <div class="space-y-6">
        <!-- König -->
        <div class="bg-neutral-950 p-4 rounded-lg border border-neutral-800">
          <h2 class="text-center font-bold tracking-wide text-xs uppercase text-neutral-200 mb-3">KÖNIG</h2>
          <div id="koenigList" class="space-y-1.5"></div>
        </div>

        <!-- Jahreswertung -->
        <div class="bg-neutral-950 p-4 rounded-lg border border-neutral-800">
          <h2 class="text-center font-bold tracking-wide text-xs uppercase text-neutral-200 mb-3">JAHRESWERTUNG</h2>
          <div id="jahreswertungList" class="space-y-1.5"></div>
        </div>
      </div>

    </div>

    <!-- Bottom Grid: Tabellen für die Spielarten -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- RAMSCH -->
      <div class="bg-neutral-950 p-4 rounded-lg border border-neutral-800">
        <h2 class="text-center font-bold tracking-wide text-xs uppercase text-neutral-200 mb-3">RAMSCH</h2>
        <table class="w-full text-xs text-left">
          <thead>
            <tr class="text-neutral-400 border-b border-neutral-800">
              <th class="py-1">Name</th>
              <th class="py-1 text-right">Sp.</th>
              <th class="py-1 text-right">+</th>
              <th class="py-1 text-right">Quote</th>
              <th class="py-1 text-right">Wertung</th>
              <th class="py-1 text-right">König</th>
            </tr>
          </thead>
          <tbody id="ramschTableBody" class="divide-y divide-neutral-900 font-mono"></tbody>
        </table>
      </div>

      <!-- SOLO -->
      <div class="bg-neutral-950 p-4 rounded-lg border border-neutral-800">
        <h2 class="text-center font-bold tracking-wide text-xs uppercase text-neutral-200 mb-3">SOLO</h2>
        <table class="w-full text-xs text-left">
          <thead>
            <tr class="text-neutral-400 border-b border-neutral-800">
              <th class="py-1">Name</th>
              <th class="py-1 text-right">Sp.</th>
              <th class="py-1 text-right">+</th>
              <th class="py-1 text-right">Quote</th>
              <th class="py-1 text-right">Wertung</th>
              <th class="py-1 text-right">König</th>
            </tr>
          </thead>
          <tbody id="soloTableBody" class="divide-y divide-neutral-900 font-mono"></tbody>
        </table>
      </div>

      <!-- OFFENSIV -->
      <div class="bg-neutral-950 p-4 rounded-lg border border-neutral-800">
        <h2 class="text-center font-bold tracking-wide text-xs uppercase text-neutral-200 mb-3">OFFENSIV</h2>
        <table class="w-full text-xs text-left">
          <thead>
            <tr class="text-neutral-400 border-b border-neutral-800">
              <th class="py-1">Name</th>
              <th class="py-1 text-right">Sp.</th>
              <th class="py-1 text-right">+</th>
              <th class="py-1 text-right">Quote</th>
              <th class="py-1 text-right">Wertung</th>
              <th class="py-1 text-right">König</th>
            </tr>
          </thead>
          <tbody id="offensivTableBody" class="divide-y divide-neutral-900 font-mono"></tbody>
        </table>
      </div>

      <!-- CONTRA -->
      <div class="bg-neutral-950 p-4 rounded-lg border border-neutral-800">
        <h2 class="text-center font-bold tracking-wide text-xs uppercase text-neutral-200 mb-3">CONTRA</h2>
        <table class="w-full text-xs text-left">
          <thead>
            <tr class="text-neutral-400 border-b border-neutral-800">
              <th class="py-1">Name</th>
              <th class="py-1 text-right">Sp.</th>
              <th class="py-1 text-right">+</th>
              <th class="py-1 text-right">Quote</th>
              <th class="py-1 text-right">Wertung</th>
              <th class="py-1 text-right">König</th>
            </tr>
          </thead>
          <tbody id="contraTableBody" class="divide-y divide-neutral-900 font-mono"></tbody>
        </table>
      </div>

    </div>

  </div>

  <script>
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQzVZyjDrE4Ae2r5vTXCbk3E3HiAwMy_iWiMbYWCTRxQdMbZxGVlEcq23vz_YFl7igcyBw3UN5DQ2Vx/pub?gid=28030364&single=true&output=csv";

    let ALL_ROWS = [];

    function cleanNumber(val) {
      if (!val) return 0;
      return parseFloat(String(val).replace(',', '.')) || 0;
    }

    function getYearFromDateStr(s) {
      if (!s) return null;
      s = String(s).trim();
      // Try to find a 4-digit year first
      const yMatch = s.match(/(19|20)\d{2}/);
      if (yMatch) return parseInt(yMatch[0], 10);
      // German format dd.mm.yyyy or dd.mm.yy
      const dMatch = s.match(/(\d{1,2})\.(\d{1,2})\.(\d{2,4})/);
      if (dMatch) {
        let y = dMatch[3];
        if (y.length === 2) y = '20' + y;
        return parseInt(y, 10);
      }
      // ISO yyyy-mm-dd
      const isoMatch = s.match(/(\d{4})-(\d{2})-(\d{2})/);
      if (isoMatch) return parseInt(isoMatch[1], 10);
      return null;
    }

    function populateYearFilter(rows) {
      const sel = document.getElementById('yearFilter');
      if (!sel) return;
      const yearsSet = new Set();

      rows.forEach(r => {
        const y = getYearFromDateStr(r['Datum']);
        if (y) {
          yearsSet.add(y);
          return;
        }
        // If Datum isn't parseable, scan other fields for 4-digit years
        Object.values(r).forEach(v => {
          if (!v) return;
          const matches = String(v).match(/(19|20)\d{2}/g);
          if (matches) matches.forEach(m => yearsSet.add(parseInt(m, 10)));
        });
      });

      let years = Array.from(yearsSet).sort((a, b) => b - a);
      const currentYear = new Date().getFullYear();

      if (years.length === 0) {
        // Fallback: last 6 years including current
        for (let i = 0; i < 6; i++) years.push(currentYear - i);
      } else if (!years.includes(currentYear)) {
        years.unshift(currentYear);
      }

      // Build options: add "Alle Jahre" option first
      sel.innerHTML = '';
      const allOpt = document.createElement('option');
      allOpt.value = '';
      allOpt.text = 'Alle Jahre';
      sel.appendChild(allOpt);

      years.forEach(y => {
        const opt = document.createElement('option');
        opt.value = String(y);
        opt.text = String(y);
        sel.appendChild(opt);
      });

      // Default to current year if available, otherwise "Alle Jahre"
      if (years.includes(currentYear)) sel.value = String(currentYear);
      else sel.value = '';

      // Trigger re-processing when changed
      sel.addEventListener('change', applyFilterAndProcess);
    }

    function applyFilterAndProcess() {
      const sel = document.getElementById('yearFilter');
      const val = sel ? sel.value : '';
      let filtered = ALL_ROWS;
      if (val) {
        const year = parseInt(val, 10);
        filtered = ALL_ROWS.filter(r => {
          const y = getYearFromDateStr(r['Datum']);
          return y === year;
        });
      }
      processData(filtered);
    }

    function formatKoenig(val) {
      if (!val || val === 0) return '0';
      if (Math.abs(val - Math.round(val)) < 0.001) {
        return String(Math.round(val));
      }
      const fixed = val.toFixed(2);
      return fixed.endsWith('0') ? val.toFixed(1).replace('.', ',') : fixed.replace('.', ',');
    }

    function processData(rows) {
      // 1. Gruppierung nach Datum (ohne Ramsch) für das Chart
      const datesMap = {};
      
      // 2. Gruppierung nach Kategorie & Spieler
      const categories = ['Ramsch', 'Solo', 'Offensiv', 'Contra'];
      const catMap = { Ramsch: {}, Solo: {}, Offensiv: {}, Contra: {} };
      const playerTotals = {};
      const spieldaten = {};

      rows.forEach(r => {
        const datum = r['Datum'] ? r['Datum'].trim() : null;
        const name = r['Name'] ? r['Name'].trim() : null;
        const spiel = r['Spiel'] ? r['Spiel'].trim() : null;
        const total = cleanNumber(r['Spiele total']);
        const gewonnen = cleanNumber(r['Gewonnen']);
        const verloren = r['Verloren'] !== undefined && r['Verloren'] !== '' 
          ? cleanNumber(r['Verloren']) 
          : Math.max(0, total - gewonnen);

        if (!name) return;

        // Gesamtübersicht pro Spieler initialisieren
        if (!playerTotals[name]) {
          playerTotals[name] = { name, total: 0, gewonnen: 0, koenigWon: 0 };
        }

        const isKoenigRow = spiel && (spiel.toLowerCase() === 'könig' || spiel.toLowerCase() === 'koenig');

        // Für Spieltage-König-Berechnung gruppieren
        if (datum && !isKoenigRow) {
          if (!spieldaten[datum]) spieldaten[datum] = [];
          spieldaten[datum].push({ datum, name, spiel, total, gewonnen, verloren });
        }

        if (total === 0 || isKoenigRow) return;

        // Spieltage Chart Logik (ohne Ramsch)
        if (datum && spiel !== 'Ramsch') {
          if (!datesMap[datum]) datesMap[datum] = { datum, spiele: 0, gewonnen: 0 };
          datesMap[datum].spiele += total;
          datesMap[datum].gewonnen += gewonnen;
        }

        // Standard-Kategorien (Ramsch, Solo, Offensiv, Contra)
        let matchedCat = null;
        if (spiel) {
          const sLower = spiel.toLowerCase();
          if (sLower === 'ramsch') matchedCat = 'Ramsch';
          else if (sLower === 'solo') matchedCat = 'Solo';
          else if (sLower === 'offensiv') matchedCat = 'Offensiv';
          else if (sLower === 'contra' || sLower === 'kontra') matchedCat = 'Contra';
        }

        if (matchedCat && catMap[matchedCat]) {
          if (!catMap[matchedCat][name]) {
            catMap[matchedCat][name] = { name, spiele: 0, gewonnen: 0, verloren: 0, koenigCount: 0 };
          }
          catMap[matchedCat][name].spiele += total;
          catMap[matchedCat][name].gewonnen += gewonnen;
          catMap[matchedCat][name].verloren += verloren;
        }

        // Reguläre Spiele für Jahreswertung
        playerTotals[name].total += total;
        playerTotals[name].gewonnen += gewonnen;
      });

      // 3. Pro Spieltag König nach Regeln ermitteln (mit geteilten Punkten bei Gleichstand)
      Object.keys(spieldaten).forEach(datum => {
        const dayRows = spieldaten[datum];

        function evalCategoryKoenig(catKey, minWins) {
          const catRows = dayRows.filter(r => {
            const s = (r.spiel || '').toLowerCase();
            if (catKey === 'Contra') return s === 'contra' || s === 'kontra';
            return s === catKey.toLowerCase();
          });

          if (catRows.length === 0) return;

          if (minWins === null) {
            // Ramsch: der mit den meisten gewonnenen Spielen
            const maxWon = Math.max(...catRows.map(r => r.gewonnen));
            if (maxWon > 0) {
              const winners = catRows.filter(r => r.gewonnen === maxWon && r.name);
              const points = 1 / winners.length;
              winners.forEach(r => {
                if (catMap[catKey] && catMap[catKey][r.name]) {
                  catMap[catKey][r.name].koenigCount = (catMap[catKey][r.name].koenigCount || 0) + points;
                }
                if (playerTotals[r.name]) {
                  playerTotals[r.name].koenigWon = (playerTotals[r.name].koenigWon || 0) + points;
                }
              });
            }
          } else {
            // Offensiv (min 10), Solo (min 3), Contra (min 3): minWins erforderlich, dann beste Differenz
            const qualified = catRows.filter(r => r.gewonnen >= minWins);
            if (qualified.length > 0) {
              const withDiff = qualified.map(r => ({
                name: r.name,
                diff: r.gewonnen - r.verloren
              }));
              const maxDiff = Math.max(...withDiff.map(w => w.diff));
              const winners = withDiff.filter(w => w.diff === maxDiff && w.name);
              const points = 1 / winners.length;
              winners.forEach(w => {
                if (catMap[catKey] && catMap[catKey][w.name]) {
                  catMap[catKey][w.name].koenigCount = (catMap[catKey][w.name].koenigCount || 0) + points;
                }
                if (playerTotals[w.name]) {
                  playerTotals[w.name].koenigWon = (playerTotals[w.name].koenigWon || 0) + points;
                }
              });
            }
          }
        }

        // Ramsch: Meiste gewonnene
        evalCategoryKoenig('Ramsch', null);
        // Offensiv: mind. 10 gewonnen, beste Differenz
        evalCategoryKoenig('Offensiv', 10);
        // Solo: mind. 3 gewonnen, beste Differenz
        evalCategoryKoenig('Solo', 3);
        // Contra: mind. 3 gewonnen, beste Differenz
        evalCategoryKoenig('Contra', 3);
      });

      // Chart Daten aufbereiten
      const chartLabels = Object.keys(datesMap);
      const chartSpiele = chartLabels.map(d => datesMap[d].spiele);
      const chartGewonnen = chartLabels.map(d => datesMap[d].gewonnen);
      const chartQuote = chartLabels.map(d => Math.round((datesMap[d].gewonnen / datesMap[d].spiele) * 100));

      renderChart(chartLabels, chartSpiele, chartGewonnen, chartQuote);

      // Tabellen rendern
      renderCategoryTable('ramschTableBody', catMap['Ramsch']);
      renderCategoryTable('soloTableBody', catMap['Solo']);
      renderCategoryTable('offensivTableBody', catMap['Offensiv']);
      renderCategoryTable('contraTableBody', catMap['Contra']);

      // Ranglisten rendern
      renderRankings(playerTotals);
    }

    function renderChart(labels, spiele, gewonnen, quote) {
      const ctx = document.getElementById('spieltageChart').getContext('2d');
      // Destroy previous chart instance if exists to avoid duplicates
      if (window.__spieltageChart) {
        try { window.__spieltageChart.destroy(); } catch (e) {}
      }
      window.__spieltageChart = new Chart(ctx, {
        data: {
          labels: labels,
          datasets: [
            {
              type: 'line',
              label: 'Quote',
              data: quote,
              borderColor: '#f97316',
              borderWidth: 2,
              pointBackgroundColor: '#f97316',
              yAxisID: 'yQuote',
              tension: 0.3
            },
            {
              type: 'bar',
              label: 'Spiele',
              data: spiele,
              backgroundColor: '#1e40af',
              yAxisID: 'yCount'
            },
            {
              type: 'bar',
              label: 'Gewonnen',
              data: gewonnen,
              backgroundColor: '#38bdf8',
              yAxisID: 'yCount'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            yCount: { position: 'left', beginAtZero: true, grid: { color: '#262626' }, ticks: { color: '#737373' } },
            yQuote: { position: 'right', min: 0, max: 100, grid: { display: false }, ticks: { callback: v => v + ' %', color: '#f97316' } },
            x: { ticks: { color: '#a3a3a3', maxRotation: 45 } }
          },
          plugins: {
            legend: { labels: { color: '#a3a3a3', boxWidth: 10, font: { size: 10 } } }
          }
        }
      });
    }

    function renderCategoryTable(tbodyId, playersData) {
      const tbody = document.getElementById(tbodyId);
      if (!tbody) return;

      const list = Object.values(playersData || {}).map(p => {
        const quote = p.spiele > 0 ? (p.gewonnen / p.spiele) : 0;
        const wertung = (quote * p.gewonnen).toFixed(2);
        const koenig = p.koenigCount || 0;
        return { ...p, quoteVal: quote, quoteStr: Math.round(quote * 100) + ' %', wertung, koenig };
      });

      // Nach Quote absteigend sortieren
      list.sort((a, b) => b.quoteVal - a.quoteVal);

      tbody.innerHTML = list.map((row, idx) => `
        <tr class="hover:bg-neutral-900 border-b border-neutral-900/50">
          <td class="py-1 font-sans ${idx === 0 ? 'text-amber-400 font-bold' : 'text-neutral-200'}">
            ${idx === 0 ? '👑 ' : ''}${row.name}
          </td>
          <td class="py-1 text-right text-neutral-400">${row.spiele}</td>
          <td class="py-1 text-right text-neutral-300">${row.gewonnen}</td>
          <td class="py-1 text-right text-neutral-200 font-bold">${row.quoteStr}</td>
          <td class="py-1 text-right text-neutral-400">${row.wertung.replace('.', ',')}</td>
          <td class="py-1 text-right text-amber-500 font-bold">${formatKoenig(row.koenig)}</td>
        </tr>
      `).join('');
    }

    function renderRankings(playerTotals) {
      const players = Object.values(playerTotals);

      // 1. König (Goldene Trichter-Balken) - Summe aller gewonnenen Könige
      const koenigContainer = document.getElementById('koenigList');
      const koenigPlayers = [...players].sort((a, b) => b.koenigWon - a.koenigWon);
      const maxKoenig = Math.max(1, ...koenigPlayers.map(p => p.koenigWon));

      koenigContainer.innerHTML = koenigPlayers.map(p => {
        const widthPct = maxKoenig > 0 ? Math.max(25, (p.koenigWon / maxKoenig) * 100) : 25;
        return `
          <div class="flex items-center text-xs">
            <span class="w-16 text-neutral-300 font-medium">${p.name}</span>
            <div class="flex-1 flex justify-center">
              <div style="width: ${widthPct}%" class="bg-amber-500 text-black font-extrabold text-center py-1 rounded-sm shadow">
                ${formatKoenig(p.koenigWon)}
              </div>
            </div>
          </div>
        `;
      }).join('');

      // 2. Jahreswertung (Rote Trichter-Balken)
      const jahresContainer = document.getElementById('jahreswertungList');
      const jahresList = players.map(p => ({
        name: p.name,
        // HIER DEINE FORMEL FÜR DIE JAHRESWERTUNG ANPASSEN:
        score: p.total > 0 ? (p.gewonnen / p.total) : 0
      })).sort((a, b) => b.score - a.score);

      const maxScore = Math.max(...jahresList.map(j => j.score), 0.01);

      jahresContainer.innerHTML = jahresList.map(p => {
        const widthPct = Math.max(30, (p.score / maxScore) * 100);
        return `
          <div class="flex items-center text-xs">
            <span class="w-16 text-neutral-300 font-medium">${p.name}</span>
            <div class="flex-1 flex justify-center">
              <div style="width: ${widthPct}%" class="bg-rose-600 text-white font-medium text-center py-1 rounded-sm shadow">
                ${p.score.toFixed(5).replace('.', ',')}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // CSV Laden & Ausführen
    Papa.parse(GOOGLE_SHEET_CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        ALL_ROWS = results.data;
        populateYearFilter(ALL_ROWS);
        applyFilterAndProcess();
      },
      error: function(err) {
        console.error("Fehler beim Laden der CSV-Daten:", err);
      }
    });
  </script>
</body>
</html>
